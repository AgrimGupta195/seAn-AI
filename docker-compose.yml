services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seanai-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      UPLOAD_DIR: /tmp
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # MongoDB Connection - Set in .env file
      MONGO_URI: ${MONGO_URI}
      # JWT Secret Key - Set in .env file
      JWT_SECRET: ${JWT_SECRET}
      # OpenAI API Key - Set in .env file
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Pinecone API Key - Set in .env file
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      # AWS S3 Configuration - Set in .env file
      AWS_REGION: ${AWS_REGION}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # Python service URL - uses internal Docker network
      PYTHON_SERVICE_URL: http://python:8000
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      python:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - seanai-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/healthz', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Frontend API Base URL - Use /api for relative URLs (Nginx will proxy to backend)
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: seanai-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    volumes:
      # Mount nginx config to ensure API proxying works
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - seanai-network

  python:
    build:
      context: ./videoTranscript
      dockerfile: Dockerfile
    container_name: seanai-python
    environment:
      PORT: 8000
      # AWS S3 Configuration - Set in .env file (needed for audio extraction)
      AWS_REGION: ${AWS_REGION}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "${PYTHON_PORT:-8000}:8000"
    restart: unless-stopped
    networks:
      - seanai-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  seanai-network:
    driver: bridge