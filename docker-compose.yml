services:
  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 5000
      UPLOAD_DIR: /tmp
      FRONTEND_URL: http://localhost:5173
      # MongoDB Connection - Set in .env file
      # Example: mongodb://localhost:27017/sean-ai
      # Or MongoDB Atlas: mongodb+srv://username:password@cluster.mongodb.net/dbname
      MONGO_URI: ${MONGO_URI}
      # JWT Secret Key - Set in .env file (use a strong random string)
      JWT_SECRET: ${JWT_SECRET}
      # OpenAI API Key - Set in .env file
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Pinecone API Key - Set in .env file
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      # AWS S3 Configuration - Set in .env file
      AWS_REGION: ${AWS_REGION}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      PYTHON_SERVICE_URL: http://python:8000
    ports:
      - "5000:5000"
    depends_on:
      - python

  frontend:
    build:
      context: ./frontend
      args:
        # Frontend API Base URL - Use /api for relative URLs (Nginx will proxy to backend)
        # For Docker Compose, use /api so Nginx can proxy requests
        # For production with separate domains, set to full backend URL
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    volumes:
      # Mount nginx config to ensure API proxying works
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5173:80"
    depends_on:
      - backend

  python:
    build:
      context: ./videotranscript
    environment:
      PORT: 8000
      # AWS S3 Configuration - Set in .env file (needed for audio extraction)
      AWS_REGION: ${AWS_REGION}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "8000:8000"